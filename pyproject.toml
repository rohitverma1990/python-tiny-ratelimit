[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "tiny-ratelimit"
version = "0.1.0"
description = "A lightweight, thread-safe Python rate limiting library"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [
    {name = "Tiny RateLimit Contributors"}
]
keywords = ["rate-limiting", "api", "throttling", "python"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: Software Development :: Libraries :: Python Modules"
]

[tool.setuptools.packages.find]
include = ["tiny_ratelimit*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
